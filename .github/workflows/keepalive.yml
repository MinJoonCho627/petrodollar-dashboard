name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity. While the owner is in military service, commits to main can be
# rare, so this job adds a tiny commit ONLY when main has been quiet for
# 45+ days. Otherwise it does nothing.
on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC (12:17 KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Commit only if main has been idle 45+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          idle_days=$(( (now - last) / 86400 ))
          echo "main idle for ${idle_days} days"
          if [ "$idle_days" -lt 45 ]; then
            echo "Recent activity found - nothing to do."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive (main idle ${idle_days} days)"
          git push origin main
